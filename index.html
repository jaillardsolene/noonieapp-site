<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NoonieApp</title>
<meta name="description" content="Small utility apps. No accounts, no ads, lifetime available.">
<meta name="color-scheme" content="light dark">
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="apple-touch-icon" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/assets/site.css">
</head>
<body class="home-page">

<header class="site-header">
  <div class="wrap"><a class="wordmark" href="/">NoonieApp</a></div>
</header>

<main>
  <div class="wrap">

    <!-- Hero. Texte du mockup de la designer (08/09/2026), verbatim. Il
         remplace le sous-titre de `noonieapp-site-content-v1.md` sur cette
         page — décision de la designer, ne pas le remettre. -->
    <section class="home-hero">
      <h1>NoonieApp</h1>
      <p class="lede">Small utility apps.</p>
      <p>No accounts, no ads, lifetime available.</p>
    </section>

    <!-- ================= ENTRÉE D'APP — PATRON DU PORTEFEUILLE =================
         UNE carte blanche contient tout : l'identité de l'app à gauche, son
         visuel à droite. Pour ajouter une app, dupliquer ce bloc.

         ⚠️ La carte n'est PAS un lien. Le seul lien vers la page de l'app est
         le cercle-flèche, à côté du nom. -->
    <div class="app-entry">

      <div>
        <div class="app-entry-head">
          <img class="app-entry-icon" src="/assets/danio-icon.webp"
               width="220" height="220" alt="">
          <p class="app-entry-name">Danio</p>
          <!-- Le cercle-flèche est le SEUL lien de la carte. Sans texte
               visible, il porte son nom accessible en `aria-label`. -->
          <a class="app-entry-go" href="/danio/" aria-label="Open Danio">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                 aria-hidden="true" focusable="false">
              <path d="M5 12h13M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

        <p class="app-entry-sub">Aquarium Care Tracker</p>

        <!-- ⚠️ LIEN APP STORE À BRANCHER ICI À LA PUBLICATION.
             Le badge n'a AUCUN lien aujourd'hui, et il n'en hérite plus
             d'aucun depuis que la carte a cessé d'être un lien : l'app n'est
             pas publiée, aucune fiche n'existe. Le jour venu, l'envelopper
             dans <a href="https://apps.apple.com/app/id…">. -->
        <img class="store-badge" src="/assets/app-store-badge.webp"
             width="400" height="119" alt="Download on the App Store">
      </div>

      <!-- Visuel de l'app. Retiré entièrement sous 760 px (voir
           `.app-entry-art` dans site.css) ; `loading="lazy"` évite de le
           télécharger là où il ne s'affiche pas. -->
      <img class="app-entry-art" src="/assets/danio-app.webp"
           width="1240" height="839" loading="lazy"
           alt="Danio's home screen: water parameters and fish stock.">

    </div>

  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    © NoonieApp 2026<span class="sep">·</span><a href="/mentions-legales">Legal</a>
  </div>
</footer>

</body>
</html>
